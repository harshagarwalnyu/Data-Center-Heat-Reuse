# PR-Agent (open-source Qodo Merge): unlimited AI PR reviews using our own Anthropic key.
# Needs repo secret ANTHROPIC_KEY (Settings > Secrets and variables > Actions). Without it the job fails harmlessly.
name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    # Public repo: only the team may trigger runs that use our API key.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
       github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR Agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-5-5"
          config.fallback_models: '["anthropic/claude-haiku-4-5-20251001"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
