[project]
name = "heatreuse"
version = "0.1.0"
description = "Hourly data-center heat reuse model for Lansing NY (hackathon 2026)"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyyaml", "matplotlib", "pytest", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatreuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
