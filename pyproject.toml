[project]
name = "heatreuse"
version = "0.1.0"
description = "8,760-hour heat reuse model for the Lake Hawkeye data center, Lansing NY"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
heatreuse = "heatreuse.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatreuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
