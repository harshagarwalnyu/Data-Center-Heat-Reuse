# Engineering inputs, Site 2 (Lake Hawkeye, Lansing NY).
# Source tags: [F2]=research/facts-site2.md, [CG]=resources/text/Colocating-Data-Centers_Greenhouses-RII-Virginia.txt,
# [T5]=resources/text/Topic_5_-_Heat_reuse,_Connecting_DC_to_DE_systems_v5.txt, [HR]=resources/text/20230623_Data_Centers_HeatReuse_101_3.2.docx.txt,
# [A]=ASSUMPTION (reason in research/model-notes.md).
site:
  name: "Lake Hawkeye, Lansing NY"
  lat: 42.602544          # research/offtakers.md (GEM wiki)
  lon: -76.635978
  epw_glob: "ith/*.epw"   # Climate.OneBuilding TMYx 2009-2023, Ithaca Tompkins Rgnl AP 725155
supply:
  it_load_mw: 150         # PLAN.md reality check; [F2] phase 1 138-150 MW
  load_factor: 0.8        # PLAN.md section 1 (0.7-0.9)
  capture_fraction: 0.75  # [A] base; scenarios 0.40 (RII 33-42% of power) and 0.85 (T5 s11 / opening deck s7-8 "up to 85% recoverable")
  capture_temp_c: 50      # [CG] DLC waste heat 45-55 C; [HR] 45-65 C
  air_capture_temp_c: 30  # [CG] legacy air-cooled 30-40 C; [HR] 27-28 C return
  diurnal_amp: 0.03       # [A] +/-3% IT load swing
  capture_availability: 0.99   # [A] sidestream trips / maintenance, ~88 h/yr
  outage_mean_h: 22       # [A]
  outage_seed: 7
  pue: 1.2                # [A] liquid-cooled new build; used only for ERF
hp:
  eta: 0.5                # task spec (0.5 x Carnot); [T5] COP 2-5 typical, COP 2.95 at 75 C supply realized
  approach_k: 3           # per heat exchanger, task spec / PLAN section 1.3
  cop_min: 2.0
  cop_max: 6.0           # organizer COP ranges 2-6 (research/digest-organizer.md sec 2.3; T5 s26 COP 2-5 typical)
onsite:
  supply_temp_c: 45       # data-contract
  pipe_km: 0.5            # data-contract
  loss_w_per_m: 15        # [A] pre-insulated twin pipe, 45 C, short run
  greenhouse:
    area_ha: 10           # task brief; [CG] 10 ha ~ 10 MW peak; 2 acres/MW
    u_eff_w_m2k: 3.5      # [A] calibrated so peak ~ 12 MW at -17 C ([CG] 10 ha ~ 10 MW; ~2 acres/MW => 12 MW)
    setpoint_c: 18.5      # [A] day 20 / night 17 C blend
    yield_kg_m2: 40       # [A] high-tech tomato, no supplemental lighting, NY winter
  aquaculture:
    fish_t_yr: 1500       # [A]
    kwh_per_kg: 3.0       # [A] RAS heating incl. makeup water and building loss
    const_share: 0.7
    t_base_c: 15
  rec:
    pool_mwh: 600         # [A] 25 m + leisure pool; Deep Green precedent: 222 MWh/yr UK 25 m + children's pool (research/case-studies.md)
    building_m2: 4000     # [A]
    kwh_m2: 140           # [A] cold-climate rec building space heat
    dhw_share: 0.15
    t_base_c: 15
corridor:
  homes: 500              # task brief
  uptake: 0.70            # [A] signed share of homes along route; pipe sized to all potential homes
  mwh_per_home: 27        # [A] 23.5 space + 3.5 DHW
  dhw_mwh_per_home: 3.5   # [A] ~250 L/day, 45 K rise
  t_balance_c: 15.5       # [A]
  trunk_km: 3.0           # [A] plant to first cluster
  frontage_m_per_home: 25 # [A] 1/4 acre lots, hamlet/lakeshore density
  loop_temp_c: 18         # task: building HP source ~15-20 C
  loop_loss_w_per_m: 6    # [A] uninsulated HDPE, ~8 K over ground
  dhw_temp_c: 55
  space_sink: {t_min: 35, t_max: 55, slope: 0.6, t_ref: 15}   # [A] weather-compensated heating curve
  supply_temp_c: 20
  label_unit: "homes"
town:
  include_in_base: false
  supply_temp_c: 65       # hot anchor loop 55-65 C base (AG p14: 55 C newest, T5 s19: 4G 50-60 C); 70 C = sensitivity
  trunk_km: 11.0          # task brief (6-7 mi); school campus 10.4-10.6 km (research/offtakers.md OSM)
  spur_km: 3.0            # [A] school to Town Hall/library cluster (~2.5 km apart)
  loss_w_per_m: 15        # [A] DN100-150 twin pre-insulated 70/40 C
  sink: {t_min: 55, t_max: 65, slope: 0.5, t_ref: 10}   # weather compensation per AG p12-13 (-20 C=75 C, +10 C=61 C; ours lower, existing school radiators may need 70 C: sensitivity)
  schools: {floor_m2: 18700, kwh_m2: 110}   # [A] 1,118 students (NCES via research/offtakers.md) x ~180 sf/student; NE school heating+DHW ~110 kWh/m2
  others:                 # [A] areas; Town Hall 8,200 sf from Lansing capital plan (research/offtakers.md)
    - {name: "Town Hall + Highway", mwh: 140}
    - {name: "Community Library + Center", mwh: 180}
    - {name: "Woodsedge senior apartments", mwh: 1200}
  dhw_share: 0.10
storage:
  hours_of_peak: 6        # task brief
  delta_t_k: 20           # [A] 50/30 C source-side store
  loss_per_day: 0.01      # [A] large insulated tank
  charge_hours: 4         # [A] max charge rate = capacity / 4 h
backup:
  efficiency: 0.9         # [A]
  capacity_share: 1.0     # of peak (D+L); N+1 not modeled
network:
  pump_share: 0.015       # [A] circulation electricity as share of delivered heat
air_source:               # incumbent comparison, seasonal COP computed hourly
  eta: 0.4                # [A]
  sink_c: 40
  approach_k: 5
